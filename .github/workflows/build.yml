name: Build Mega MiniGames

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17 (obrigatório para Minecraft 1.20.1)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache do Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/loom-cache
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle.properties', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Dar permissão ao gradlew
        run: chmod +x ./gradlew

      # Compilar as classes numa etapa própria mantém cada processo abaixo do limite do runner.
      - name: Preparar daemon e compilar classes
        shell: bash
        run: |
          set +e
          ./gradlew --daemon classes clientClasses --console=plain > gradle-compile.log 2>&1
          compile_exit_code=$?
          if [ "$compile_exit_code" -ne 0 ]; then
            {
              echo '## Falha ao compilar classes'
              echo 'Últimas linhas do log:'
              echo '```text'
              tail -n 120 gradle-compile.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            relevant=$(grep -n -E "error:|Exception|FAILED|BUILD FAILED|Caused by|OutOfMemory|Killed|cannot find symbol|cannot override|symbol:|location:" gradle-compile.log | tail -n 40)
            if [ -z "$relevant" ]; then
              relevant=$(tail -n 25 gradle-compile.log)
            fi
            safe_block="${relevant//'%'/'%25'}"
            safe_block="${safe_block//$'\r'/'%0D'}"
            safe_block="${safe_block//$'\n'/'%0A'}"
            echo "::error title=Gradle compile::$safe_block"
            exit "$compile_exit_code"
          fi
          tail -n 40 gradle-compile.log

      - name: Publicar log de compilação quando falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-compile-log
          path: gradle-compile.log
          if-no-files-found: ignore

      - name: Testes e JAR executável
        shell: bash
        run: |
          set +e
          ./gradlew --daemon test --console=plain > gradle-build.log 2>&1
          build_exit_code=$?
          if [ "$build_exit_code" -eq 0 ]; then
            ./gradlew --daemon remapJar --console=plain >> gradle-build.log 2>&1
            build_exit_code=$?
          fi
          if [ "$build_exit_code" -ne 0 ]; then
            {
              echo '## Falha no build do Gradle'
              echo 'Últimas linhas do log:'
              echo '```text'
              tail -n 80 gradle-build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            relevant=$(grep -n -E "error:|Exception|FAILED|BUILD FAILED|Caused by|OutOfMemory|Killed|cannot find symbol|cannot override|AssertionFailedError|symbol:|location:" gradle-build.log | tail -n 40)
            if [ -z "$relevant" ]; then
              relevant=$(tail -n 25 gradle-build.log)
            fi
            safe_block="${relevant//'%'/'%25'}"
            safe_block="${safe_block//$'\r'/'%0D'}"
            safe_block="${safe_block//$'\n'/'%0A'}"
            echo "::error title=Gradle build::$safe_block"
            exit "$build_exit_code"
          fi
          tail -n 40 gradle-build.log

      - name: Publicar log do Gradle quando o build falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log
          if-no-files-found: ignore

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: mega-minigames-jar
          path: build/libs/*.jar
          if-no-files-found: error

name: Build JAR

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout sem actions externas
        shell: bash
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch -q --depth 1 origin "${{ github.sha }}"
          git checkout -q FETCH_HEAD

      - name: Instalar JDK 17
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openjdk-17-jdk-headless
          JDK17=/usr/lib/jvm/java-17-openjdk-amd64
          "$JDK17/bin/javac" -version
          echo "JAVA_HOME=$JDK17" >> "$GITHUB_ENV"
          echo "$JDK17/bin" >> "$GITHUB_PATH"

      - name: Compilar e empacotar o mod
        shell: bash
        run: |
          chmod +x ./gradlew
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version
          set +e
          ./gradlew --no-daemon -Dorg.gradle.java.home="$JAVA_HOME" build --console=plain > build.log 2>&1
          code=$?
          tail -n 80 build.log
          echo "$code" > build-exit-code.txt
          if [ "$code" -ne 0 ]; then
            git config user.name "Arena CI"
            git config user.email "ci@arena.local"
            git add -f build.log build-exit-code.txt
            git commit -q -m "ci: log do build [skip ci]" || true
            git push -q origin "HEAD:${GITHUB_REF_NAME}" || true
            exit "$code"
          fi
          ls -l build/libs

      - name: Publicar o jar na release
        if: github.event_name != 'pull_request' && success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^mod_version=//p' gradle.properties)
          JAR=$(ls build/libs/*.jar | grep -v sources | head -n 1)
          echo "Publicando $JAR na release v$VERSION"
          gh release view "v$VERSION" >/dev/null 2>&1 \
            || gh release create "v$VERSION" --target "$GITHUB_SHA" \
                 --title "Mega MiniGames v$VERSION" --notes "Build automático do Mega MiniGames."
          gh release upload "v$VERSION" "$JAR" --clobber
          gh release edit "v$VERSION" \
            --notes "Última compilação: ${GITHUB_REF_NAME} @ ${GITHUB_SHA:0:7} (run ${GITHUB_RUN_NUMBER}). Baixe o jar em Assets."

name: Verify Build
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout sem actions externas
        shell: bash
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch -q --depth 1 origin "${{ github.sha }}"
          git checkout -q FETCH_HEAD
      - name: Instalar JDK 17
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openjdk-17-jdk-headless
          java -version
      - name: Compilar com Gradle
        shell: bash
        run: |
          chmod +x ./gradlew
          set +e
          ./gradlew --no-daemon classes clientClasses --console=plain > compile.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            echo '## Falha na compilação'
            echo '```text'
            grep -n -E "error:|Exception|FAILED|cannot find symbol|symbol:|location:" compile.log | tail -n 60
            echo '```'
            tail -n 60 compile.log
            exit "$code"
          fi
          tail -n 20 compile.log

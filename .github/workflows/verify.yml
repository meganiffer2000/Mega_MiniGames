name: Verify Build
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout sem actions externas
        shell: bash
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch -q --depth 1 origin "${{ github.sha }}"
          git checkout -q FETCH_HEAD
      - name: Instalar JDK 17
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openjdk-17-jdk-headless
          JDK17="$(dirname "$(dirname "$(readlink -f "$(which javac)")")")"
          if [ ! -x "$JDK17/bin/javac" ]; then JDK17=/usr/lib/jvm/java-17-openjdk-amd64; fi
          echo "JAVA_HOME=$JDK17" >> "$GITHUB_ENV"
          echo "$JDK17/bin" >> "$GITHUB_PATH"
          "$JDK17/bin/java" -version
      - name: Compilar com Gradle
        shell: bash
        run: |
          chmod +x ./gradlew
          set +e
          ./gradlew --no-daemon classes clientClasses --console=plain > compile.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            echo '## Falha na compilação'
            tail -n 150 compile.log
          else
            tail -n 20 compile.log
          fi
          echo "$code" > build-exit-code.txt
          git config user.name "Arena CI"
          git config user.email "ci@arena.local"
          git add -f compile.log build-exit-code.txt
          git commit -q -m "ci: log da compilação [skip ci]" || true
          git push -q origin "HEAD:${GITHUB_REF_NAME}" || true
          exit "$code"
